<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>book 객체 만들기</title>
</head>
<body>
    <h3>book 객체 만들기</h3>
    <hr>
    <script>
        // book 객체 생성 후 출력
        let book = new Object();
        book.title = "황기태";
        book.author = "HTML5";
        book.price = 20000;
        document.write ("book : " + book.title + ", " + book.author + ", " + book.price);
    
    </script>
    
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>자기소개 페이지</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 3px solid #4a90e2;
        }
        h1 {
            margin-bottom: 12px;
            color: #333;
        }
        p {
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="profile.jpg" alt="프로필 사진" class="profile-img">
        <h1>곽정훈</h1>
        <p>
            안녕하세요! 저는 웹프로그래밍을 공부하고 있는 곽정훈입니다.<br>
            새로운 기술을 배우는 것을 좋아하고, 창의적인 웹사이트를 만드는 데 관심이 많습니다.<br>
            앞으로 다양한 프로젝트를 통해 실력을 키우고 싶습니다.<br>
            취미는 사진 찍기와 음악 감상입니다.
        </p>
    </div>
</body>
</html>

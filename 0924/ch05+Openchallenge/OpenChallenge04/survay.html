<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>소프트웨어 기술 선호에 대한 설문</title>
    <link rel="stylesheet" href="survey4.css" type = "text/css">
</head>
<body>
    <header>
        <h1>설문지</h1>
        <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
    </header>
    <hr>
    <form>
        <p>
            <span>학년</span>
            <input type = "radio" name = "grade" value = "1">1학년
            <input type = "radio" name = "grade" value = "2">2학년
            <input type = "radio" name = "grade" value = "3">3학년
            <input type = "radio" name = "grade" value = "4">4학년
        </p>

        <p>
            <span>성별</span>
            <input type = "radio" name = "gender" value = "man">남자
            <input type = "radio" name = "gender" value = "girl">여자
        </p>

        <p>
            <span>관심분야</span>
            <select>
                <option value = "mobile">모바일 소프트웨어</option>
                <option value = "backenbd">백엔드 소프트웨어</option>
                <option value = "ai">인공지능 개발</option>
            </select>
        </p>

        <p>
            <span>진로&#40다중 선택&#41</span>
            <input type = "checkbox" value = "1">개발
            <input type = "checkbox" value = "2">기획
            <input type = "checkbox" value = "3">영업
            <input type = "checkbox" value = "4">창업
        </p>

        <p>
            <span>남기고 싶은 말</span>
            <textarea cols = "50" rows = "10" placeholder = "글을 남겨주세요"></textarea>
        </p>
    </form> 
    
    <footer>
        Copyright 2022 by Kitae
    </footer>
</body>
</html>

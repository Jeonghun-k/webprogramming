<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text-shadow와 box-shadow</title>
    <style>
        h3 {
            color : yellow;
            text-shadow : 2px 2px 3px blue;
            text-align: center;
        }
        img:hover{
            box-shadow: 2px 2px 2px blue,
            0 0 25px blue,
            0 0 5px darkblue;
        }
    </style>
</head>
<body>
    <h3>Most Visited Pages</h3>
    <hr>
    <table>
        <tr>
            <td>
                <img src = "google.png" width="200xs" height="140">
            </td>
            <td>
                <img src="naver.png" alt="" width="200" height="140">
            </td>
            <td>
                <img src="amazon.png" alt="" width="200" height="140">
            </td>
        </tr>
    </table>
    
</body>
</html>

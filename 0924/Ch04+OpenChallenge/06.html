<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>링크 꾸미기</title>
    <style>
        a {
            color : green;
            text-decoration : none;
        }
        a:hover{
            color : violet;
            text-decoration : underline;
        }
    </style>
</head>
<body>
    <h3>링크 꾸미기</h3>
    <p>
        초록색에 밑줄없는 링크. 마우스를 올리면 밑줄과 violet 색으로 변경
    </p>
    <hr>
    <ul>
        <!--밑줄 없앨 때 style text-decoration:none 작성-->
        <li><a href = "https://naver.com">네이버 사이트</a></li>
        <li><a href="https://google.com">구글 사이트</a></li>
    </ul>
    
</body>
</html>

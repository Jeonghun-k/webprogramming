<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스펀지밥</title>
</head>
<body>
    <h3>클릭하면 90도 회전합니다.</h3>
    <hr>
    <img src="sp.png" alt="스펀지밥" onclick="rotate(this)">
    <script>
        function rotate(obj){
            obj.style.transform = 'rotate(90deg)'
        }
    </script>
</body>
</html>

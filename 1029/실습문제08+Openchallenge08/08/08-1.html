<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transform:rotate()</title>
</head>
<body>
    <h3>클릭하면 2,3,4배로 옆으로 늘어납니다.</h3>
    <hr>
    <img src="sp.png" alt="" width="200" height="300" onclick="getlarge(this)">
    <script>
        let size = 1;

        function getlarge(obj){
            size++;
            if(size > 4) size = 1;

            obj.style.transform = `scale(${size}, 1)`
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 객체의 target</title>
    <script>
        function init(){
            // li를 liArray 배열에 대입
            var liArray = document.getElementsByTagName("li");
            // 반복문으로 li에 클릭 이벤트 핸들러를  등록
            // 사용자가 각 항목 클릭할 때마다 click 함수 선택됨
            for(var i = 0; i < liArray.length; ++i){
                liArray[i].onclick = click;
            }

            function click(e){
                reset();        // 모든 li의 글자 크기를 원래대로 돌림
                e.target.style.fontSize = "1.3em"; // 원상태로 돌린 후 선택 된 것만 1.3배 키움
            }
            function reset(e){
                for(var i = 0; i < liArray.length; ++i){
                    liArray[i].style.fontSize = "1em";  // 모든 글자사이즈 원상 복귀
                }
                
            }
        }
    </script>
</head>
<body onload = "init()">
    <h3>아이템을 클릭하면 1.3배 크기로</h3>
    <hr>   
    <p>여름 방학 때 하고 싶은 것들</p>
    <ul>
        <li>자전거로 대한민국 일주</li>
        <li>책 100권 읽기</li>
        <li>철인 3종 경기 준비</li>
        <li>자바스크립트 정복</li>
    </ul>
</body>
</html>

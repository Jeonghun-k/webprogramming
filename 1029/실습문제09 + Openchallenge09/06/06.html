<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <h3>
        마우스 휠을 이용한 이미지 확대/축소
    </h3>
    <hr>
    <p>이미지 위에 휠을 위로 굴리면 이미지가 축소 되고 아래로 굴리면 이미지가 확대 됩니다</p>
    <img src="sp.png" alt="" width="150px" height="150px" id = "img">
    <script>
        var size = 150;

        function img(e){
            if(e.wheelDelta < 0){
                size = size - (size * 0.5);
                if (size < 0){
                    size = 0;
                }
            }
            if(e.wheelDelta > 0){
                size = size + (size*0.5);
            }
            document.getElementById("img").style.width = size + "px";
            document.getElementById("img").style.height = size + "px";

        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>인사하기</title>
</head>
<body>
  <h3>인사하기</h3>
  <hr>
  <script>
    let name = "";

    // 이름이 null(취소) 이거나 빈문자열일 경우 반복
    while (name == null || name.trim() === "") {
      name = prompt("이름을 입력하세요", "곽정훈");
      if (name == null) {
        alert("입력을 취소했습니다.");
        break; // 취소한 경우 반복문 종료
      } else if (name.trim() === "") {
        alert("이름을 반드시 입력해야 합니다!");
      }
    }

    if (name != null && name.trim() !== "") {
      document.write("Hello, " + name + "님 😊");
    }
  </script>
</body>
</html>

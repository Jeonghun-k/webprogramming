<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
    년도를 입력받아 윤년인지 평년인지를 판별하여 출력하는 프로그램 작성
    -->
    <script>
        let year = prompt("년도를 입력하세요");
        year = Number(year);

        if((year % 4 ===0 && year % 100 !== 0) || (year % 400 === 0)){
            alert(year + "년은 윤년입니디")
        }else{
            alert(year + "년은 평년입니다");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>별 문자 출력</title>
</head>
<body>
    <script>
        // 1. 사용자로부터 숫자를 입력받습니다.
        let num = parseInt(prompt("숫자를 입력하세요:"));

        // 2. 입력받은 숫자만큼 별 문자를 출력합니다.
        
        for (let i = 0; i < num; i++) {
            let stars = "";
            for(let j = 0; j <= i; j++){
                stars += "*";
            }
            document.write(stars + "<br>");
        }
        if (isNaN(num) || num < !Number.isInteger(num)){
            document.write("<h3>별 문자 출력하기</h3><hr>");
            document.write("입력 오류 입니다.");
        
        }

        // 3. 결과를 화면에 출력합니다.
        
    </script>
</body>
</html>

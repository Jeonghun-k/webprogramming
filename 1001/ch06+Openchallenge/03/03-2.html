<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document.write()</title>
</head>
<body>
    <script>
        /*
        table로 표 시작
        tr로 행 시작
        th로 제목 셀 만들어서 n을 출력
        이후 for문을 이용하여 td와 j값을출력
        */
        document.write("<h1>document.write()로 표만들기</h1>");
        document.write("<hr>");
        document.write("<table border='1'>");
        document.write("<tr>");
        document.write("<th>n</th>");
        
        for(let j = 0; j <= 9; j++){
            document.write("<td>");
            document.write(j);
            document.write("</td>");
        }

        document.write("</tr><tr>");
        document.write("<th>");
        document.write("n<sup>2</sup>");
        document.write("</th>");

        for (let j = 0; j < 10; j++) {
        document.write("<td>");
        document.write(j * j);
        document.write("</td>");
        }
        document.write("</tr>");
        document.write("</table>");

    </script>
    
</body>
</html>

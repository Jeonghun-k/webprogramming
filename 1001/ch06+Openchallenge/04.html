<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월화수목금토일</title>
</head>
<body>
    <h3>월화수목금토일</h3>
    <hr>
    <script>
        var days = prompt("월화수목금토일 중에서 입력하세요");
        if (days == "월"){
            document.write("월요일은 출근");
        } else if(days == "화"){
            document.write("화요일은 외근");
        } else if(days == "수"){
            document.write("수요일은 회의");
        } else if(days == "목"){
            document.write("목요일은 교육");
        } else if(days == "금"){
            document.write("금요일은 휴무");
        } else if(days == "토"){
            document.write("토요일은 휴무");
        } else if(days == "일"){
            document.write("일요일은 휴무");
        } else {
            document.write("월화수목금토일 중에서 입력하세요");
        }
    </script>
    
    
</body>
</html>

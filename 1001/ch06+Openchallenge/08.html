<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>eval()로 수식계산</h3>
    <hr>
    <script>
        let num = prompt("수식 입력");
        let a = eval(num);
        document.write(num + "=" + a);
    </script>
    
</body>
</html>

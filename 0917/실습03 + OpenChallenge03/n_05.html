<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>도형서식 폼 만들기</title>
</head>
<body>
    <h3>도형 서식 폼 만들기</h3>
    <hr>
    <form>
        <fieldset>
            <legend>도형 서식 입력</legend>
            <label>
                선종류 <select 3>
                    <option>선없음</option>
                    <option>실선</option>
                    <option>점선</option>
                </select>
            </label><br><br>

            <label>
                선두께 <input type = "number" min = "1" max = "40" step = "1">
            </label>

            <label>
                선색 <input type = "color" value = "#000000">
            </label>
            <br><br>
            <label>
                투명도(0~100) : <input type = "range" min = "0" max = "100" list = "invisable">
            </label>
            <datalist id = "invisable">
                <option value = "10" label ="LOW">
                <option value = "50" label = "MID">
                <option value = "90" label = "HIGH">
                </datalist>
        </fieldset>
    </form>
</body>
</html>

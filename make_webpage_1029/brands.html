<!DOCTYPE html>
<html lang='ko'>
    <head>
        <meta charset='UTF-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1.0'>
        <title>브랜드별 향수</title>
        <link rel='stylesheet' href='styles.css'>
        <style>
            /* (내가) 네비게이터에 내가 어디페이지에있는지 강조 */
            .nav a[href = "brands.html"]{
                color: #000;
                font-weight: bold;
                background-color: #f3f3f3;
                border-radius: 4px;
            }
            .site-header{
                background : ivory;
            }
            /* (내가)사진 사이즈에 맞게 기존에 제공된 박스 사이즈 변경 */
            .cards {
                display: flex;
                gap: 16px;
            }
            .card { 
                flex: 0 0 auto;
                border: 1px solid #ddd;
                border-radius: 10px;
                padding: 8px;
                background: #fff;
                text-align: center;
            }
            .card img {
                max-width: 180px;
                height: auto;
                border-radius: 4px;
            }
            /* (내가) 카드에 그림자 호버기능 */
            .card:hover{
                box-shadow : 0 4px 8px rgb(0,0,0);
            }

        </style>
    </head>
    <body>
        <!-- (내가) 각 페이지에도 배너 추가하고 그 페이지에 맞는곳에 호버 유지하게하기 -->
        <header class = "site-header">
            <div class="container header-inner">
                <a href="index.html" class = "logo" aria-label="Chez Scent 홈">Chez scent</a>
                <nav class="nav" aria-label="주요 메뉴">
                    <a href="index.html" target="_blank" rel="noopener">홈</a>
                    <a href="glossary.html" class="active">향수 용어</a>
                    <a href="notes.html" target="_blank" rel="noopener">향수 노트</a>
                    <a href="brands.html" target="_blank" rel="noopener">브랜드별 향수</a>
                </nav>
                <div class="icons">
                    <button class="icon-btn" aria-label="검색 열기" id="openSearch">🔎</button>
                    <button class="icon-btn" aria-label="로그인" id="openLogin">👤</button>
                    <button class="icon-btn" aria-label="유튜브" id="openYoutube">
                        <a href="https://youtube.com/@hyang_suda?si=i_9g1T9GB4ag6FPf" target = "_blank">
                            📽️
                        </a>
                    </button>
                </div>
            </div>
        </header>
        <div class='page container'>
            <h1>브랜드별 대표 향수</h1>
            <div class='cards'>
                <article class='card'>
                    <img src='assets/아쿠아.jpg' alt='Amber'>
                    <h3>Aqua di Parma</h3><p class='muted'>피코 디 아말피</p>
                </article>
                <article class='card'>
                    <img src='assets/오어레.png' alt='Citrus' width="350px" height="500px">
                    <h3>Prederic Malle</h3>
                    <p class='muted'>
                        포트레이트 오브 어 레이디
                    </p>
                </article>
            </div>
        </div>
    </body>
</html>
